<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Counter App</title>
    <link rel="stylesheet" href="./style.css">
</head>

<body>

    <div class="container">
        <h1>Counter</h1>
        <div class="counter" id="counter">0</div>

        <div class="buttons">
            <button class="decrease" id="decrease" onclick="dbtnHandler()">Decrease</button>
            <button class="reset" id="reset" onclick="rbtnHandler()">Reset</button>
            <button class="increase" id="increase" onclick="ibtnHandler()">Increase</button>
        </div>
    </div>

    <script src="app.js"></script>
</body>

</html>
